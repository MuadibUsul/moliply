<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude 账号托管台</title>
<style>
  :root {
    --bg: #0e0e10;
    --panel: #17171a;
    --panel-2: #1e1e22;
    --line: #2a2a30;
    --text: #ededf0;
    --muted: #8b8b96;
    --accent: #4f8dfd;
    --accent-dim: #2b4f8f;
    --ok: #3fb950;
    --warn: #d29922;
    --bad: #f85149;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.55 -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 22px 20px 90px; }

  h1 { font-size: 18px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: 12.5px; }

  .btn {
    border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
    padding: 7px 13px; border-radius: 8px; cursor: pointer; white-space: nowrap;
    transition: background .13s, border-color .13s, opacity .13s;
  }
  .btn:hover:not(:disabled) { background: #26262c; border-color: #3a3a42; }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 560; }
  .btn-primary:hover:not(:disabled) { background: #3f7ce8; border-color: #3f7ce8; }
  .btn-sm { padding: 5px 10px; font-size: 12.5px; border-radius: 7px; }
  .btn-ghost { background: none; border-color: transparent; color: var(--muted); }
  .btn-ghost:hover:not(:disabled) { background: var(--panel-2); color: var(--text); }
  .btn-danger { color: var(--bad); }
  .btn-danger:hover:not(:disabled) { background: #f8514915; border-color: #f8514955; }

  .gate { max-width: 420px; margin: 14vh auto; text-align: center; }
  .gate h1 { font-size: 21px; margin-bottom: 8px; }
  .gate p { color: var(--muted); margin: 0 0 20px; }
  .gate input { width: 100%; text-align: center; font-family: ui-monospace, Consolas, monospace; }

  input, textarea, select {
    width: 100%; background: #101013; border: 1px solid var(--line);
    padding: 8px 10px; border-radius: 8px; outline: none;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--accent-dim); }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .field { margin-bottom: 12px; }
  .hint { font-size: 11.5px; color: var(--muted); margin-top: 4px; }

  /* ---- status header ---- */
  .topbar { display: flex; align-items: flex-start; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
  .topbar .titles { flex: 1; min-width: 190px; }
  .metrics { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .metric {
    flex: 1 1 178px; text-align: left; padding: 10px 13px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--panel); cursor: default;
    transition: border-color .14s, background .14s;
  }
  button.metric { cursor: pointer; }
  button.metric:hover { border-color: #3a3a42; background: var(--panel-2); }
  .metric .k { font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
  .metric .v { font-size: 15px; font-weight: 620; margin-top: 3px; }
  .metric.good .v { color: var(--ok); }
  .metric.warn .v { color: var(--warn); }
  .metric.bad .v { color: var(--bad); }
  .metric.alarm { border-color: #f8514966; background: #f8514910; animation: alarm 1.6s ease-in-out infinite; }
  @keyframes alarm { 50% { border-color: #f85149cc; background: #f8514920; } }
  .metric .detail { font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* ---- filters ---- */
  .filters { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 14px; }
  .pill-filter {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px;
    border-radius: 999px; border: 1px solid var(--line); background: var(--panel);
    color: var(--muted); cursor: pointer; font-size: 12.5px;
  }
  .pill-filter:hover { color: var(--text); border-color: #3a3a42; }
  .pill-filter.on { background: #4f8dfd1f; border-color: #4f8dfd66; color: #cfe0ff; }
  .pill-filter .n {
    font-variant-numeric: tabular-nums; font-size: 11px; padding: 0 5px;
    border-radius: 999px; background: #ffffff14;
  }
  .pill-filter.hot .n { background: #f8514933; color: #ffb4b0; }

  /* ---- cards ---- */
  .grid { display: grid; gap: 11px; }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 14px 16px;
  }
  .card.is-running { border-color: #4f8dfd88; animation: breathe 2.2s ease-in-out infinite; }
  @keyframes breathe { 50% { border-color: #4f8dfd33; } }
  .card-top { display: flex; align-items: flex-start; gap: 12px; }
  .name { font-weight: 620; font-size: 14.5px; word-break: break-all; }
  .meta { color: var(--muted); font-size: 11.5px; margin-top: 3px; font-family: ui-monospace, Consolas, monospace; }

  .pill {
    font-size: 11.5px; padding: 3px 9px; border-radius: 999px;
    border: 1px solid transparent; white-space: nowrap; font-weight: 550;
  }
  .p-idle { color: var(--ok); background: #3fb9501a; border-color: #3fb95038; }
  .p-busy { color: var(--accent); background: #4f8dfd1a; border-color: #4f8dfd38; }
  .p-cooldown { color: var(--warn); background: #d299221a; border-color: #d2992238; }
  .p-bad { color: var(--bad); background: #f851491a; border-color: #f8514938; }
  .p-dead { color: var(--muted); background: #8b8b961a; border-color: #8b8b9638; }

  .actions { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 11px; }
  .note { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .note.warn { color: #e6b455; }
  .note.bad { color: #ffb4b0; }

  .fixbox { margin-top: 10px; padding: 11px 12px; border: 1px solid #f8514933; background: #f851490d; border-radius: 9px; }
  .fixbox .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .fixbox .row > * { flex: 1 1 210px; }

  .empty { text-align: center; padding: 46px 20px; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--radius); }

  /* ---- drawer ---- */
  .scrim { position: fixed; inset: 0; background: #000000b0; opacity: 0; pointer-events: none; transition: opacity .18s; z-index: 40; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; height: 100vh; width: min(720px, 96vw);
    background: var(--panel); border-left: 1px solid var(--line); z-index: 50;
    transform: translateX(102%); transition: transform .22s ease; display: flex; flex-direction: column;
  }
  .drawer.open { transform: translateX(0); }
  .drawer-head { display: flex; align-items: center; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
  .drawer-head h2 { font-size: 15px; margin: 0; flex: 1; }
  .drawer-body { padding: 16px 18px 26px; overflow: auto; flex: 1; }
  .drawer-foot { display: flex; gap: 8px; justify-content: flex-end; padding: 13px 18px; border-top: 1px solid var(--line); }

  table.preview { width: 100%; border-collapse: collapse; font-size: 11.5px; margin-top: 10px; }
  table.preview th { text-align: left; color: var(--muted); font-weight: 550; padding: 5px 6px; border-bottom: 1px solid var(--line); }
  table.preview td { padding: 5px 6px; border-bottom: 1px solid #ffffff0d; font-family: ui-monospace, Consolas, monospace; }
  table.preview tr.bad td { background: #f8514914; color: #ffb4b0; }
  table.preview td.st { font-family: inherit; }

  pre {
    background: #0a0a0c; border: 1px solid var(--line); border-radius: 8px;
    padding: 12px; overflow: auto; font: 12px/1.6 ui-monospace, Consolas, monospace;
    white-space: pre-wrap; word-break: break-all; margin: 0;
  }
  code { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }

  /* ---- toasts ---- */
  .toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 200; max-width: 380px; }
  .toast {
    background: #22313f; border: 1px solid #3f566e; padding: 10px 14px; border-radius: 9px;
    font-size: 12.5px; box-shadow: 0 8px 24px #00000066;
  }
  .toast.err { background: #3a1d1f; border-color: #f8514977; color: #ffc9c6; }
  .toast.ok { background: #16301d; border-color: #3fb95077; color: #bff3cb; }
</style>
</head>
<body>

<div class="wrap" id="app" hidden>
  <div class="topbar">
    <div class="titles">
      <h1>Claude 账号托管台</h1>
      <div class="sub" id="fleet-line">加载中…</div>
    </div>
    <div class="actions" style="margin-top:0">
      <button class="btn btn-primary" id="btn-import">＋ 批量导入账号</button>
      <button class="btn" id="btn-cards">客户与客户端</button>
      <button class="btn btn-ghost" id="btn-logout">退出</button>
    </div>
  </div>

  <div class="metrics" id="metrics"></div>
  <div class="filters" id="filters"></div>
  <div class="grid" id="list"></div>
  <div class="empty" id="list-empty" hidden>没有账号。点右上角「批量导入账号」开始。</div>
</div>

<div class="gate" id="gate" style="display:none">
  <h1>Claude 账号托管台</h1>
  <p>已登录运营后台可直接进入；否则输入管理密码</p>
  <div class="field"><input id="token" type="password" placeholder="管理密码" autocomplete="current-password"></div>
  <button class="btn btn-primary" id="btn-login" style="width:100%">进入</button>
</div>

<div class="scrim" id="scrim"></div>

<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <h2 id="drawer-title">—</h2>
    <button class="btn btn-ghost" id="drawer-close">关闭</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
  <div class="drawer-foot" id="drawer-foot"></div>
</aside>

<div class="toasts" id="toasts"></div>

<script>
const B = window.CCE_BASE ?? location.pathname.replace(/\/ui$/, "").replace(/\/$/, "");
let TOKEN = localStorage.getItem("cce_token") || "";

/* ------------------------------------------------------------------ utils */

const $ = (sel) => document.querySelector(sel);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function toast(message, kind) {
  const el = document.createElement("div");
  el.className = "toast" + (kind ? " " + kind : "");
  el.textContent = message;
  $("#toasts").appendChild(el);
  setTimeout(() => el.remove(), kind === "err" ? 6000 : 3200);
}

/** Every request goes through here: prefix, auth, cookie, error reporting. */
async function apiFetch(path, options = {}) {
  const headers = { "content-type": "application/json", ...(options.headers || {}) };
  if (TOKEN) headers["x-admin-token"] = TOKEN;
  const res = await fetch(B + path, { ...options, credentials: "same-origin", headers });
  hideBoot();
  let body = null;
  const text = await res.text();
  try { body = text ? JSON.parse(text) : null; } catch { body = { detail: text }; }
  if (res.status === 401) {
    logout();
    if ($("#gate").style.display !== "") throw new Error("未登录");
    throw new Error("密码不对");
  }
  if (!res.ok) {
    const detail = body?.detail || body?.error || `HTTP ${res.status}`;
    toast(detail, "err");
    throw new Error(detail);
  }
  return body;
}

function hideBoot() { const b = $("#boot"); if (b) b.hidden = true; }

function logout() {
  TOKEN = "";
  localStorage.removeItem("cce_token");
  $("#app").hidden = true;
  $("#gate").style.display = "";
}

/* ------------------------------------------------------------------ store */

const STORE = { profiles: [], status: null, filter: "all", timer: null, closed: new Set() };

const STAGE = {
  queued:       { label: "排队中", cls: "p-dead", bucket: "active" },
  registering:  { label: "注册中", cls: "p-busy", bucket: "active" },
  registered:   { label: "已注册", cls: "p-busy", bucket: "active" },
  subscribing:  { label: "开 Pro 中", cls: "p-busy", bucket: "active" },
  subscribed:   { label: "已开通 Pro", cls: "p-busy", bucket: "needcred" },
  needs_human:  { label: "待人工", cls: "p-cooldown", bucket: "human" },
  failed:       { label: "流程失败", cls: "p-bad", bucket: "human" },
  ready:        { label: "就绪", cls: "p-idle", bucket: "ready" },
};

const STATUS_LABEL = {
  IDLE: ["空闲", "p-idle"], BUSY: ["使用中", "p-busy"], COOLDOWN: ["冷却中", "p-cooldown"],
  AUTH_EXPIRED: ["登录失效", "p-bad"], PROXY_DEAD: ["出口异常", "p-bad"], BANNED: ["已封禁", "p-dead"],
};

function bucketOf(p) {
  if (p.job_stage) return STAGE[p.job_stage]?.bucket || "other";
  return p.has_credentials ? "ready" : "needcred";
}

function labelFor(p) {
  if (!p.has_credentials && (p.job_stage === "ready" || !p.job_stage)) return ["缺凭证", "p-cooldown"];
  if (p.job_stage) return [STAGE[p.job_stage]?.label || p.job_stage, STAGE[p.job_stage]?.cls || "p-dead"];
  return STATUS_LABEL[p.status] || [p.status, "p-dead"];
}

const deliverable = (p) =>
  p.status === "IDLE" && p.has_credentials && (!p.job_stage || p.job_stage === "ready");

/* ---------------------------------------------------------------- refresh */

async function refreshAll() {
  let data;
  try {
    const [status, profiles] = await Promise.all([
      apiFetch("/admin/status"),
      apiFetch("/admin/profiles"),
    ]);
    STORE.status = status;
    STORE.profiles = profiles.profiles || [];
  } catch {
    return schedule();
  }
  renderAll();
  schedule();
}

function schedule() {
  if (STORE.timer) clearTimeout(STORE.timer);
  const active = STORE.profiles.some((p) =>
    ["queued", "registering", "registered", "subscribing"].includes(p.job_stage || ""));
  STORE.timer = setTimeout(refreshAll, active ? 3000 : 15000);
}

/* ----------------------------------------------------------------- render */

function renderAll() {
  const counts = { all: STORE.profiles.length, human: 0, active: 0, needcred: 0, ready: 0 };
  for (const p of STORE.profiles) {
    const b = bucketOf(p);
    if (b in counts) counts[b] += 1;
  }
  STORE.counts = counts;
  renderMetrics();
  renderFilters();
  renderList();
}

function renderMetrics() {
  const s = STORE.status;
  if (!s) return;
  const cards = s.cards || {};
  const available = cards.available || 0;
  const running = s.worker?.busy;

  const readyCls = s.ready ? "good" : "bad";
  const readyText = s.ready ? "正常" : "异常";
  const readyDetail = s.ready ? "全部组件就绪" : s.problems.join("；");

  const workerCls = !s.worker?.enabled ? "bad" : running ? "warn" : "good";
  const workerText = !s.worker?.enabled ? "已停止" : running ? "正在执行" : "运行中";
  const workerDetail = running
    ? `${s.worker.running_email || s.worker.running_profile} · ${s.worker.running_stage}`
    : s.worker?.queued ? `排队 ${s.worker.queued} 条` : "空闲";

  $("#metrics").innerHTML = [
    `<div class="metric ${readyCls}"><div class="k">系统就绪</div><div class="v">${readyText}</div><div class="detail">${esc(readyDetail)}</div></div>`,
    `<button class="metric ${workerCls}" data-open="worker"><div class="k">调度引擎</div><div class="v">${workerText}</div><div class="detail">${esc(workerDetail)}</div></button>`,
    `<button class="metric ${available ? "good" : "bad alarm"}" data-open="cards"><div class="k">充值卡弹药</div><div class="v">可用 ${available}</div><div class="detail">使用中 ${cards.in_use || 0} · 已废 ${cards.dead || 0} · 已用 ${cards.used || 0}</div></button>`,
  ].join("");

  $("#metrics").querySelectorAll("[data-open]").forEach((el) => {
    el.onclick = () => openDrawer(el.dataset.open);
  });
}

function renderFilters() {
  const c = STORE.counts;
  const defs = [
    ["all", "全部", c.all, false],
    ["human", "待人工 / 失败", c.human, true],
    ["active", "队列与执行中", c.active, false],
    ["needcred", "缺凭证待同步", c.needcred, false],
    ["ready", "就绪可交付", c.ready, false],
  ];
  $("#filters").innerHTML = defs.map(([key, label, n, hot]) =>
    `<button class="pill-filter ${STORE.filter === key ? "on" : ""} ${hot && n ? "hot" : ""}" data-filter="${key}">
       ${label}<span class="n">${n}</span>
     </button>`).join("");
  $("#filters").querySelectorAll("[data-filter]").forEach((el) => {
    el.onclick = () => { STORE.filter = el.dataset.filter; renderAll(); };
  });
}

function renderList() {
  const rows = STORE.filter === "all"
    ? STORE.profiles
    : STORE.profiles.filter((p) => bucketOf(p) === STORE.filter);
  $("#list-empty").hidden = rows.length > 0;
  $("#list-empty").textContent = STORE.profiles.length
    ? "该分类下没有账号。"
    : "没有账号。点右上角「批量导入账号」开始。";
  $("#list").innerHTML = rows.map(card).join("");
  $("#list").querySelectorAll("[data-act]").forEach((el) => {
    el.onclick = () => onAction(el.dataset.act, el.dataset.id);
  });
  $("#fleet-line").textContent = STORE.profiles.length
    ? `${STORE.profiles.length} 个账号 · 待人工 ${STORE.counts.human} · 就绪 ${STORE.counts.ready}`
    : "尚无账号";
}

function card(p) {
  const [label, cls] = labelFor(p);
  const running = STORE.status?.worker?.running_profile === p.profile_id;
  const trouble = p.status === "PROXY_DEAD" || p.status === "AUTH_EXPIRED";
  const reason = p.human_note || p.last_error || "";
  const needCred = !p.has_credentials && (!p.job_stage || p.job_stage === "ready" || p.job_stage === "subscribed");
  const canDeliver = deliverable(p);

  return `<div class="card ${running ? "is-running" : ""}">
    <div class="card-top">
      <div style="flex:1">
        <div class="name">${esc(p.email || p.profile_id)}</div>
        <div class="meta">${esc(p.profile_id)} · 出口 ${esc(p.expected_ip)} · 端口 ${esc(p.local_proxy_port)}</div>
      </div>
      <span class="pill ${cls}">${label}</span>
    </div>

    ${reason ? `<div class="note ${p.job_stage === "needs_human" ? "warn" : "bad"}">${esc(reason)}</div>` : ""}
    ${needCred ? `<div class="note warn">没有登录凭证，客户打不开。点「同步凭证」完成登录。</div>` : ""}
    ${trouble ? `<div class="note warn">出口 IP 变了或登录失效，先修好再交付。</div>` : ""}

    ${p.job_stage === "needs_human" || (!p.job_stage && trouble) ? fixBox(p) : ""}

    <div class="actions">
      ${canDeliver ? `<button class="btn btn-primary btn-sm" data-act="deliver" data-id="${esc(p.profile_id)}">复制交付指令</button>` : ""}
      ${p.job_stage && !["ready"].includes(p.job_stage)
        ? `<button class="btn btn-sm" data-act="resume" data-id="${esc(p.profile_id)}">继续流程</button>` : ""}
      ${needCred || p.job_stage === "subscribed"
        ? `<button class="btn btn-sm ${needCred ? "btn-primary" : ""}" data-act="sync" data-id="${esc(p.profile_id)}">同步凭证</button>` : ""}
      <button class="btn btn-sm" data-act="stealth" data-id="${esc(p.profile_id)}">检测环境</button>
      ${p.has_credentials && !canDeliver
        ? `<button class="btn btn-sm" data-act="skip" data-id="${esc(p.profile_id)}">标为就绪</button>` : ""}
      <button class="btn btn-sm btn-ghost" data-act="bundle" data-id="${esc(p.profile_id)}" ${canDeliver ? "" : "disabled"}>整合包</button>
      ${p.status === "IDLE" && p.has_credentials
        ? `<button class="btn btn-sm btn-danger" data-act="release" data-id="${esc(p.profile_id)}">释放</button>` : ""}
    </div>
  </div>`;
}

/** Repair affordances, chosen from what the backend actually complained about. */
function fixBox(p) {
  const reason = (p.human_note || p.last_error || "").toLowerCase();
  const proxyIssue = reason.includes("代理") || p.status === "PROXY_DEAD" || reason.includes("ip");
  const mailIssue = reason.includes("验证码") || reason.includes("gmail") || reason.includes("邮箱");
  const manualGate = !proxyIssue && !mailIssue;

  if (proxyIssue) {
    return `<div class="fixbox">
      <div class="field"><label>新的住宅代理 URL</label>
        <input id="px-${esc(p.profile_id)}" value="${esc(p.proxy_url || "")}" placeholder="socks5://user:pass@host:port"></div>
      <div class="field"><label>该代理的真实出口 IP</label>
        <input id="ip-${esc(p.profile_id)}" value="${esc(p.expected_ip || "")}" placeholder="203.0.113.7"></div>
      <div class="actions" style="margin-top:0">
        <button class="btn btn-primary btn-sm" data-act="fixproxy" data-id="${esc(p.profile_id)}">保存并重排</button>
        <button class="btn btn-sm" data-act="stealth" data-id="${esc(p.profile_id)}">先测当前出口</button>
      </div>
    </div>`;
  }
  if (mailIssue) {
    return `<div class="fixbox">
      <div class="field"><label>Gmail 应用专用密码（16 位，可在 Google 账号 → 安全性 生成）</label>
        <input id="pw-${esc(p.profile_id)}" placeholder="abcd efgh ijkl mnop"></div>
      <div class="actions" style="margin-top:0">
        <button class="btn btn-sm" data-act="testmail" data-id="${esc(p.profile_id)}">测试 IMAP</button>
        <button class="btn btn-primary btn-sm" data-act="fixmail" data-id="${esc(p.profile_id)}">保存并重排</button>
      </div>
    </div>`;
  }
  return `<div class="fixbox">
    <div class="note" style="margin-top:0">多半卡在人机校验。先去「检测环境」确认出口与指纹，人工过掉验证后点「标为就绪」。</div>
    <div class="actions" style="margin-top:8px">
      <button class="btn btn-primary btn-sm" data-act="skip" data-id="${esc(p.profile_id)}">我已手动处理，标为就绪</button>
    </div>
  </div>`;
}

/* ---------------------------------------------------------------- actions */

async function onAction(act, id) {
  const p = STORE.profiles.find((x) => x.profile_id === id);
  if (!p) return;
  try {
    if (act === "resume") {
      toast("正在推进，可能要几分钟…");
      await apiFetch(`/admin/jobs/${id}/run`, { method: "POST" });
    } else if (act === "sync") {
      toast("正在打开账号环境取凭证…");
      await apiFetch(`/admin/profiles/${id}/sync-credentials`, { method: "POST" });
      toast("凭证已同步", "ok");
    } else if (act === "stealth") {
      toast("正在检测出口与指纹…");
      const r = await apiFetch(`/admin/profiles/${id}/stealth-check`, { method: "POST" });
      const failed = Object.entries(r.checks || {}).filter(([, ok]) => !ok).map(([k]) => k);
      toast(failed.length ? `不一致：${failed.join("、")}` : "出口与指纹一致", failed.length ? "err" : "ok");
    } else if (act === "skip") {
      await apiFetch(`/admin/jobs/${id}/skip`, { method: "POST" });
      toast("已标为就绪", "ok");
    } else if (act === "release") {
      if (!confirm(`释放 ${id}？正在跑的客户会被断开。`)) return;
      await apiFetch(`/admin/profiles/${id}/release`, { method: "POST" });
    } else if (act === "bundle") {
      const os = /Win/i.test(navigator.platform) ? "windows" : "linux";
      toast("正在打包…");
      const res = await fetch(`${B}/admin/bundle/${id}?os_name=${os}`, {
        headers: TOKEN ? { "x-admin-token": TOKEN } : {},
        credentials: "same-origin",
      });
      if (!res.ok) throw new Error(`打包失败 HTTP ${res.status}`);
      const url = URL.createObjectURL(await res.blob());
      const a = document.createElement("a");
      a.href = url; a.download = `${id}-${os}.zip`; a.click();
      URL.revokeObjectURL(url);
    } else if (act === "deliver") {
      await copyDelivery(id);
    } else if (act === "fixproxy") {
      const proxy = $(`#px-${id}`).value.trim();
      const ip = $(`#ip-${id}`).value.trim();
      if (!proxy || !ip) return toast("代理和出口 IP 都要填", "err");
      // A profile imported before the pipeline existed has no job row; fix the
      // profile itself in that case so the box still works.
      await apiFetch(p.job_stage ? `/admin/jobs/${id}/proxy` : `/admin/profiles/${id}/proxy`, {
        method: "PATCH",
        body: JSON.stringify({ upstream_proxy_url: proxy, expected_ip: ip }),
      });
      toast("已保存", "ok");
    } else if (act === "testmail") {
      const pw = $(`#pw-${id}`).value.trim();
      if (!pw) return toast("先填应用专用密码", "err");
      const r = await apiFetch(`/admin/mail/check?email=${encodeURIComponent(p.email)}&app_password=${encodeURIComponent(pw)}`);
      toast(r.ok ? "IMAP 可用" : r.error, r.ok ? "ok" : "err");
    } else if (act === "fixmail") {
      const pw = $(`#pw-${id}`).value.trim();
      if (!pw) return toast("先填应用专用密码", "err");
      await apiFetch(`/admin/jobs/${id}/mail`, {
        method: "PATCH", body: JSON.stringify({ app_password: pw }),
      });
      toast("已保存并重排", "ok");
    }
  } catch {
    /* apiFetch already reported it */
  }
  refreshAll();
}

/** Mint a key and put the whole customer command on the clipboard. */
async function copyDelivery(id) {
  const key = await apiFetch("/admin/keys", {
    method: "POST",
    body: JSON.stringify({ profile_id: id, plan_tier: "pro", valid_days: 30 }),
  });
  const host = location.origin + B;
  const files = (await apiFetch("/admin/client")).files || [];
  const gateway = files.includes("tls.crt") ? `${location.hostname}:8444` : "<网关地址>";
  const win = files.includes("claude-box-windows-x64.exe");
  const cmd = win
    ? [
        "# 1. 下载启动器和证书（只需一次），放到同一个文件夹",
        `curl.exe -H "x-admin-token: ${TOKEN}" -o claude-box.exe "${host}/admin/client/claude-box-windows-x64.exe"`,
        `curl.exe -H "x-admin-token: ${TOKEN}" -o gateway-ca.pem "${host}/admin/client/tls.crt"`,
        "",
        "# 2. 在该文件夹里打开 PowerShell，每次用这个",
        `$env:CCE_TUNNEL_CA="$PWD\\gateway-ca.pem"`,
        `.\\claude-box.exe cli \``,
        `  --key ${key.card_key} \``,
        `  --secret ${key.tunnel_secret} \``,
        `  --host ${host} --gateway ${gateway}`,
      ].join("\n")
    : [
        "# 1. 下载启动器和证书（只需一次）",
        `curl -H "x-admin-token: ${TOKEN}" -o claude-box "${host}/admin/client/claude-box"`,
        `curl -H "x-admin-token: ${TOKEN}" -o gateway-ca.pem "${host}/admin/client/tls.crt"`,
        "chmod +x claude-box",
        "",
        "# 2. 启动（每次用这个）",
        `CCE_TUNNEL_CA=./gateway-ca.pem ./claude-box cli \\`,
        `  --key ${key.card_key} \\`,
        `  --secret ${key.tunnel_secret} \\`,
        `  --host ${host} --gateway ${gateway}`,
      ].join("\n");
  try {
    await navigator.clipboard.writeText(cmd);
    toast(`交付指令已复制，30 天后失效（${key.expires_at.slice(0, 10)}）`, "ok");
  } catch {
    openDrawer("deliver", { id, cmd, expires: key.expires_at });
    return;
  }
  openDrawer("deliver", { id, cmd, expires: key.expires_at });
}

/* ----------------------------------------------------------------- drawer */

function openDrawer(kind, ctx = {}) {
  const body = $("#drawer-body");
  const foot = $("#drawer-foot");
  foot.innerHTML = "";
  $("#drawer").classList.add("open");
  $("#drawer").setAttribute("aria-hidden", "false");
  $("#scrim").classList.add("open");

  if (kind === "worker") {
    $("#drawer-title").textContent = "调度引擎";
    const s = STORE.status || {};
    body.innerHTML = `<div class="note">自动调度每 ${s.worker?.interval ?? 20} 秒取一条排队任务，一次一个浏览器。</div>
      <div class="note">当前：${s.worker?.busy ? `${esc(s.worker.running_email)} · ${esc(s.worker.running_stage)}` : "空闲"}</div>
      <div class="note">排队：${s.worker?.queued ?? 0} 条</div>`;
    foot.innerHTML = `<button class="btn btn-primary" id="d-run">立即推进一次</button>`;
    $("#d-run").onclick = async () => {
      toast("已手动触发");
      await apiFetch("/admin/jobs/run", { method: "POST", body: JSON.stringify({ limit: 1, concurrency: 1 }) });
      refreshAll();
    };
    return;
  }

  if (kind === "cards") {
    $("#drawer-title").textContent = "充值卡";
    body.innerHTML = `<div class="note">每行 <code>卡号,月,年,CVV,邮编</code>。开 Pro 按顺序取一张可用卡，硬拒付标废不再重试。</div>
      <div class="field" style="margin-top:12px"><textarea id="d-cards" rows="7" placeholder="4242424242424242,12,2029,123,10001"></textarea></div>
      <div id="d-cards-list" class="note">加载中…</div>`;
    foot.innerHTML = `<button class="btn btn-primary" id="d-cards-add">导入卡片</button>`;
    $("#d-cards-add").onclick = async () => {
      const items = $("#d-cards").value.split("\n").map((l) => l.trim()).filter(Boolean).map((line) => {
        const [pan, month, year, cvv, zip] = line.split(",").map((c) => (c || "").trim());
        return { pan, exp_month: month, exp_year: year, cvv, billing_zip: zip };
      }).filter((i) => i.pan && i.cvv);
      if (!items.length) return toast("没有可导入的行", "err");
      const r = await apiFetch("/admin/cards", { method: "POST", body: JSON.stringify({ items }) });
      toast(`导入 ${r.created} 张${r.failed.length ? `，失败 ${r.failed.length}` : ""}`, r.failed.length ? "err" : "ok");
      $("#d-cards").value = "";
      loadCardsInto();
      refreshAll();
    };
    loadCardsInto();
    return;
  }

  if (kind === "import") {
    $("#drawer-title").textContent = "批量导入账号";
    body.innerHTML = `
      <div class="note">每行一条：<b>邮箱,应用专用密码,IP</b>，可再补 <b>代理URL,套餐,密码</b>。
        代理留空时套用下面的模板，<code>{ip}</code> 会按行替换。直接从 Excel 复制多行即可。</div>
      <div class="field" style="margin-top:12px"><label>代理模板（可选）</label>
        <input id="d-tpl" placeholder="socks5://user:pass@host:1080"></div>
      <div class="field"><label>粘贴内容</label>
        <textarea id="d-import" rows="7" placeholder="acct1@gmail.com,abcd efgh ijkl mnop,203.0.113.7"></textarea></div>
      <div class="note" id="d-preview-hint">粘贴后这里实时预览解析结果。</div>
      <div id="d-preview"></div>`;
    foot.innerHTML = `<button class="btn btn-primary" id="d-do-import">导入并开始</button>`;
    const reparse = () => renderPreview();
    $("#d-import").addEventListener("input", reparse);
    $("#d-tpl").addEventListener("input", reparse);
    $("#d-do-import").onclick = async () => {
      const { rows, bad } = parseRows();
      if (!rows.length) return toast("没有可导入的行", "err");
      const r = await apiFetch("/admin/jobs/import", {
        method: "POST",
        body: JSON.stringify({
          text: $("#d-import").value,
          proxy_template: $("#d-tpl").value.trim(),
        }),
      });
      toast(`已建 ${r.created} 个环境${bad ? `，${bad} 行有问题` : ""}`, r.failed.length ? "err" : "ok");
      closeDrawer();
      refreshAll();
    };
    renderPreview();
    return;
  }

  if (kind === "deliver") {
    $("#drawer-title").textContent = "交付指令";
    body.innerHTML = `<div class="note">把下面整段发给客户，30 天后失效（${esc(ctx.expires?.slice(0, 10) || "")}）。</div>
      <pre style="margin-top:12px">${esc(ctx.cmd)}</pre>`;
    foot.innerHTML = `<button class="btn btn-primary" id="d-copy">复制</button>`;
    $("#d-copy").onclick = async () => {
      try { await navigator.clipboard.writeText(ctx.cmd); toast("已复制", "ok"); }
      catch { toast("浏览器拒绝剪贴板，请手动选中", "err"); }
    };
    return;
  }

  if (kind === "client") {
    $("#drawer-title").textContent = "客户端与证书";
    body.innerHTML = `<div class="note">给客户的文件都从这里发。</div><div id="d-client" class="note">加载中…</div>`;
    apiFetch("/admin/client").then((data) => {
      const files = data.files || [];
      $("#d-client").innerHTML = files.length ? files.map((f) =>
        `<div class="actions"><a class="btn btn-sm" href="${B}/admin/client/${encodeURIComponent(f)}" download>${esc(f)}</a></div>`
      ).join("") : "服务器上还没有放客户端程序。";
    });
    return;
  }
}

function closeDrawer() {
  $("#drawer").classList.remove("open");
  $("#drawer").setAttribute("aria-hidden", "true");
  $("#scrim").classList.remove("open");
}

async function loadCardsInto() {
  const box = $("#d-cards-list");
  if (!box) return;
  try {
    const data = await apiFetch("/admin/cards");
    const s = data.summary || {};
    box.innerHTML = `总数 ${s.total || 0} · 可用 ${s.available || 0} · 使用中 ${s.in_use || 0} · 已废 ${s.dead || 0}`
      + (data.items || []).slice(0, 8).map((c) =>
        `<div>${esc(c.card_bin)}******${esc(c.last4)} · ${esc(c.exp)} · ${esc(c.status)}</div>`).join("");
  } catch { /* reported */ }
}

/* ------------------------------------------------------- import preview */

function parseRows() {
  const tpl = $("#d-tpl")?.value.trim() || "";
  const rows = [];
  let bad = 0;
  for (const raw of ($("#d-import")?.value || "").split("\n")) {
    const line = raw.trim();
    if (!line || line.startsWith("#")) continue;
    const parts = line.split(",").map((c) => c.trim());
    const email = (parts[0] || "").toLowerCase();
    const pw = parts[1] || "";
    const ip = parts[2] || "";
    const proxy = parts[3] || (tpl && ip ? tpl.replace("{ip}", ip) : "");
    const problems = [];
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) problems.push("邮箱");
    if (!pw) problems.push("应用密码");
    if (!ip) problems.push("IP");
    if (!proxy) problems.push("代理");
    if (problems.length) bad += 1;
    rows.push({ email, pw, ip, proxy, plan: parts[4] || "pro", problems });
  }
  return { rows, bad };
}

function renderPreview() {
  const { rows, bad } = parseRows();
  const hint = $("#d-preview-hint");
  const box = $("#d-preview");
  if (!box) return;
  if (!rows.length) {
    hint.textContent = "粘贴后这里实时预览解析结果。";
    box.innerHTML = "";
    return;
  }
  hint.textContent = `${rows.length} 行，${bad ? `${bad} 行有问题（红底）` : "格式全部通过"}`;
  box.innerHTML = `<table class="preview">
    <thead><tr><th>邮箱</th><th>应用密码</th><th>IP</th><th>代理</th><th>套餐</th><th>校验</th></tr></thead>
    <tbody>${rows.map((r) => `<tr class="${r.problems.length ? "bad" : ""}">
      <td>${esc(r.email || "—")}</td><td>${esc(r.pw ? "••••" : "—")}</td><td>${esc(r.ip || "—")}</td>
      <td>${esc(r.proxy || "—")}</td><td>${esc(r.plan)}</td>
      <td class="st">${r.problems.length ? "缺 " + r.problems.join("/") : "OK"}</td>
    </tr>`).join("")}</tbody></table>`;
}

/* ------------------------------------------------------------------- boot */

$("#btn-login").onclick = async () => {
  const value = $("#token").value.trim();
  if (!value) return toast("请输入管理密码", "err");
  TOKEN = value;
  try {
    await apiFetch("/admin/status");
    localStorage.setItem("cce_token", value);
    enter();
  } catch { /* reported */ }
};
$("#token").addEventListener("keydown", (e) => e.key === "Enter" && $("#btn-login").click());
$("#btn-logout").onclick = logout;

$("#btn-import").onclick = () => openDrawer("import");
$("#btn-cards").onclick = () => openDrawer("client");
$("#drawer-close").onclick = closeDrawer;
$("#scrim").onclick = closeDrawer;
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); });

function enter() {
  hideBoot();
  $("#gate").style.display = "none";
  $("#app").hidden = false;
  refreshAll();
}

// Cookie-first: a logged-in admin never sees the password gate.
apiFetch("/admin/status")
  .then(enter)
  .catch(() => {
    TOKEN = "";
    localStorage.removeItem("cce_token");
    hideBoot();
    $("#gate").style.display = "";
  });
</script>
</body>
