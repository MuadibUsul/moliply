name: moliply

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-moliply}
      POSTGRES_USER: ${POSTGRES_USER:-moliply}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moliply_dev_password}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-moliply} -d ${POSTGRES_DB:-moliply}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: ./recharge-gateway-backend
      args:
        INSTALL_BROWSER: ${INSTALL_BROWSER:-false}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://moliply:moliply_dev_password@db:5432/moliply}
      REDIS_URL: redis://redis:6379/0
      TASK_MODE: celery
      PUBLIC_STORE_URL: ${PUBLIC_STORE_URL:-http://localhost}
      PUBLIC_REDEEM_URL: ${PUBLIC_REDEEM_URL:-http://localhost/redeem}
      API_BASE_URL: ${API_BASE_URL:-http://localhost}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 8

  worker:
    build:
      context: ./recharge-gateway-backend
      args:
        INSTALL_BROWSER: "true"
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://moliply:moliply_dev_password@db:5432/moliply}
      REDIS_URL: redis://redis:6379/0
      TASK_MODE: celery
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "app.tasks.celery_worker.celery_app", "worker", "-l", "INFO", "--concurrency=2"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_worker.celery_app inspect ping -t 5 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  beat:
    build:
      context: ./recharge-gateway-backend
      args:
        INSTALL_BROWSER: ${INSTALL_BROWSER:-false}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://moliply:moliply_dev_password@db:5432/moliply}
      REDIS_URL: redis://redis:6379/0
      TASK_MODE: celery
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    command: ["celery", "-A", "app.tasks.celery_worker.celery_app", "beat", "-l", "INFO"]
    healthcheck:
      disable: true

  web:
    build:
      context: ./recharge-gateway-frontend
      args:
        API_PROXY_TARGET: http://api:8000
        NEXT_PUBLIC_STORE_URL: ${PUBLIC_STORE_URL:-http://localhost}
        NEXT_PUBLIC_REDEEM_URL: ${PUBLIC_REDEEM_URL:-http://localhost/redeem}
        NEXT_PUBLIC_CONTACT_WECHAT: ${NEXT_PUBLIC_CONTACT_WECHAT:-MOLIPLY-SUPPORT}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    depends_on:
      api:
        condition: service_started
    # The storefront is served through Nginx. Uncomment only for direct debugging:
    # ports:
    #   - "3000:3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
    ports:
      - "${HTTP_PORT:-80}:80"
      # - "443:443"
    depends_on:
      - web
      - api

volumes:
  db_data:
  redis_data:
