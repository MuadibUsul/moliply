# HTTPS example — copy the useful parts into nginx/conf.d/shop.moliply.conf
# and nginx/conf.d/up.moliply.conf after obtaining certificates with:
#
#   docker run --rm -v "$PWD/nginx/certs:/etc/letsencrypt" certbot/certbot \
#     certonly --webroot -w /var/www/certbot \
#     -d shop.moliply.com -d up.moliply.com \
#     --email you@example.com --agree-tos --no-eff-email
#
# The HTTP server blocks must keep serving /.well-known/acme-challenge/ for
# renewals. Add this inside each server block (and a 443 block mirroring the
# existing proxy locations):

# listen 443 ssl http2;
# ssl_certificate     /etc/letsencrypt/live/shop.moliply.com/fullchain.pem;
# ssl_certificate_key /etc/letsencrypt/live/shop.moliply.com/privkey.pem;
# ssl_protocols TLSv1.2 TLSv1.3;
# ssl_ciphers HIGH:!aNULL:!MD5;
# ssl_session_cache shared:SSL:10m;
# ssl_session_timeout 1d;
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# location ^~ /.well-known/acme-challenge/ {
#     root /var/www/certbot;
# }
