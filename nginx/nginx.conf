user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 2m;

    log_format moliply '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" '
                       '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log moliply;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml image/svg+xml;

    upstream moliply_web {
        server web:3000;
        keepalive 32;
    }

    upstream moliply_api {
        server api:8000;
        keepalive 32;
    }

    # Spec section 6: 10 requests/minute per IP for code verification endpoints.
    limit_req_zone $binary_remote_addr zone=redeem_zone:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=general_zone:10m rate=120r/m;
    limit_req_status 429;

    include /etc/nginx/conf.d/*.conf;
}
