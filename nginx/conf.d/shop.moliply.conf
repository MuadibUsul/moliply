server {
    listen 80 default_server;
    server_name shop.moliply.com www.shop.moliply.com localhost 127.0.0.1;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Brand MOLIPLY always;

    location = /healthz {
        proxy_pass http://moliply_api/healthz;
        include /etc/nginx/snippets/proxy.conf;
    }

    # Rate-limited redemption endpoints (spec section 6).
    location ~ ^/api/v1/redeem/(verify-code|parse-session|submit)$ {
        limit_req zone=redeem_zone burst=5 nodelay;
        proxy_pass http://moliply_api;
        include /etc/nginx/snippets/proxy.conf;
    }

    location /api/ {
        limit_req zone=general_zone burst=40 nodelay;
        proxy_pass http://moliply_api;
        include /etc/nginx/snippets/proxy.conf;
    }

    location /_next/static/ {
        proxy_pass http://moliply_web;
        include /etc/nginx/snippets/proxy.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://moliply_web;
        include /etc/nginx/snippets/proxy.conf;
    }
}
