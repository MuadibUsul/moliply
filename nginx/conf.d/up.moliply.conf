server {
    listen 80;
    server_name up.moliply.com up.moliply.test;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Brand MOLIPLY always;

    location = / {
        return 302 /redeem;
    }

    location ~ ^/api/v1/redeem/(verify-code|parse-session|submit)$ {
        limit_req zone=redeem_zone burst=5 nodelay;
        proxy_pass http://moliply_api;
        include /etc/nginx/snippets/proxy.conf;
    }

    location /api/ {
        limit_req zone=general_zone burst=40 nodelay;
        proxy_pass http://moliply_api;
        include /etc/nginx/snippets/proxy.conf;
    }

    location /_next/static/ {
        proxy_pass http://moliply_web;
        include /etc/nginx/snippets/proxy.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://moliply_web;
        include /etc/nginx/snippets/proxy.conf;
    }
}
